<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>HouPhone Shop</title>
    <style>
      /* Loading splash, shown before React mounts. Same ground and glow as the app (QR-Sense dark). */
      html, body { background: #060a14; }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background-color: #060a14;
        background-image:
          radial-gradient(900px 520px at 50% -120px, rgba(37, 99, 235, 0.42), transparent 70%),
          radial-gradient(520px 340px at 85% 0, rgba(59, 130, 246, 0.14), transparent 70%);
        z-index: 9999;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #splash.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      #splash .tile {
        width: 64px;
        height: 64px;
        padding: 8px;
        box-sizing: border-box;
        border-radius: 18px;
        background: #faf8fd;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
      }
      #splash img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #splash .brand {
        font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 32px;
        line-height: 36px;
        font-weight: 600;
        color: #faf8fd;
        letter-spacing: -0.05em;
        /* The shop name sets its own direction, so the full stop stays at its end in Arabic too. */
        unicode-bidi: plaintext;
      }
      #splash .brand::after {
        content: ".";
        color: #3b82f6;
      }
      #splash .subtitle {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 500;
        color: #93c5fd;
        letter-spacing: 0.14em;
      }
      #splash .subtitle::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #3b82f6;
        box-shadow: 0 0 12px rgba(59, 130, 246, 0.9);
      }
      #splash .loader {
        margin-top: 24px;
        width: 40px;
        height: 3px;
        border-radius: 3px;
        background: rgba(250, 248, 253, 0.07);
        overflow: hidden;
        position: relative;
      }
      #splash .loader::after {
        content: '';
        position: absolute;
        left: -40%;
        top: 0;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #3b82f6;
        animation: loader-slide 1.2s ease-in-out infinite;
      }
      /* Light theme (data-theme is set by boot-theme.js before first paint). */
      html[data-theme="light"], html[data-theme="light"] body { background: #eff2f8; }
      html[data-theme="light"] #splash {
        background-color: #eff2f8;
        background-image:
          radial-gradient(900px 520px at 50% -120px, rgba(37, 99, 235, 0.16), transparent 70%),
          radial-gradient(520px 340px at 85% 0, rgba(59, 130, 246, 0.08), transparent 70%);
      }
      html[data-theme="light"] #splash .tile { box-shadow: 0 0 0 1px rgba(30, 48, 96, 0.14); }
      html[data-theme="light"] #splash .brand { color: #0b1220; }
      html[data-theme="light"] #splash .subtitle { color: #1d4ed8; }
      html[data-theme="light"] #splash .loader { background: rgba(15, 23, 42, 0.1); }
      @keyframes loader-slide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .loader::after { animation: none; left: 30%; }
      }
    </style>
    <script src="/boot-theme.js"></script>
  </head>
  <body>
    <div id="splash">
      <div class="tile"><img id="splash-logo" src="/logo.png" alt="" /></div>
      <div class="brand" id="splash-brand">HouPhone Shop</div>
      <div class="subtitle">MANAGEMENT SUITE</div>
      <div class="loader"></div>
    </div>
    <script src="/boot-splash.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
